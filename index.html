    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
      />
    </noscript>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gerald.Dev | Agencia de Desarrollo Web" />
    <meta property="og:description" content="Construyendo experiencias que marcan la diferencia. Desarrollo Web y Apps Profesionales a Medida." />
    <meta property="og:url" content="https://geralddev.com.ar/" />
    <meta property="og:image" content="https://geralddev.com.ar/img/Logo-negro.webp" /> 

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Gerald.Dev",
      "image": "https://geralddev.com.ar/img/Logo-negro.webp",
      "url": "https://geralddev.com.ar/",
      "telephone": "+5492664952528",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "San Luis",
        "addressCountry": "AR"
      },
      "priceRange": "$$",
      "description": "Agencia de desarrollo web y software a medida. Especialistas en e-commerce, landing pages y sistemas de gestión para potenciar marcas.",
      "sameAs": [
        "https://www.instagram.com/gerald.devv/"
      ]
    }
    </script>

    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000318;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
      }
      .loader-logo {
        width: 140px;
        height: auto;
        /* Animación de latido (pulse) con resplandor */
        animation: pulseLogo 2s infinite ease-in-out;
      }
      @keyframes pulseLogo {
        0% {
          transform: scale(0.95);
          opacity: 0.6;
          filter: drop-shadow(0 0 15px rgba(181, 222, 247, 0.1));
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
          filter: drop-shadow(0 0 35px rgba(181, 222, 247, 0.5));
        }
        100% {
          transform: scale(0.95);
          opacity: 0.6;
          filter: drop-shadow(0 0 15px rgba(181, 222, 247, 0.1));
        }
      }
    </style>
  </head>
  <body>
    <noscript>Necesitás habilitar JavaScript para usar esta web.</noscript>
    
    <div id="root">
      <div id="initial-loader">
        <img src="/img/Logo-negro.webp" alt="Cargando Gerald.Dev..." class="loader-logo" />
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
